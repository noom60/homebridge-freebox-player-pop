# Tests à chaque envoi ; à chaque « Release » GitHub, la version est mise en
# attente sur npm (stage publish) par la « publication de confiance » (OIDC) :
# aucun jeton npm n'est stocké dans le dépôt, et rien n'est en ligne tant que
# le mainteneur n'a pas approuvé avec sa 2FA.
name: Tests et publication

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Vérifier que la version correspond au tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "Tag $TAG ≠ package.json $PKG"; exit 1; }
      # « npm stage » n'existe que dans les npm récents : version figée.
      - run: npm install -g npm@11.17.0
      - run: npm ci
      # Le Trusted Publisher n'a que le droit « stage publish » : la version
      # attend l'approbation du mainteneur (2FA) sur npmjs.com avant d'être en ligne.
      - run: npm stage publish --provenance --access public
